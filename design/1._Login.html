<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <div class="min-h-screen flex flex-col items-center justify-center p-page-margin md:p-gutter-xl">
    <main class="w-full max-w-md flex flex-col gap-gutter-lg">
      <!-- Brand Header + Campus Illustration -->
      <header class="flex flex-col items-center text-center gap-gutter-sm">
        <img src="https://lh3.googleusercontent.com/aida/ALJJyrBVKHidyA74x1PnQHZuBCKajh1LVbrMkGJ2C87TQG9q7i-6xh2PkRbSU55MqE24bawvlIR662qEHMuNrF77KdGhNs__DeuIwtSAGKb7V33w5Iu-_LI0y8WYFDzv6DXkOE_Y6Usv4ddq4O33sXPEtAGcP2ws0INXKbMRnN7bM2duCeBBygiziP9PVVaV2MjKyivd830VFshCXMglaQwnK7WLDZImFH5_MDE2Ay8dG34c8Ni9V0rY" alt="University campus library with students studying" class="w-full h-40 object-cover rounded border border-light-outline-variant shadow-sm" data-stitch-original-src="99c84f35bfea1227===../../images/campus_login.jpg">
        <div class="flex flex-col gap-gutter-xs pt-gutter-xs">
          <h1 data-component-id="typography-display" data-component-type="typography" data-component-variant="display" data-design-text-token="display-lg" class="font-display text-display-lg-mobile md:text-display-lg text-light-on-surface text-balance">
            BandUp Words
          </h1>
          <p data-component-id="typography-body" data-component-type="typography" data-component-variant="body" data-design-text-token="body-lg" class="font-body text-body-lg text-light-on-surface-variant text-pretty max-w-xs mx-auto">
            Boost your IELTS vocabulary with flashcards and active Speaking, Writing, Reading &amp; Listening practice.
          </p>
        </div>
      </header>

      <!-- Login Card -->
      <section data-component-id="card-elevated" data-component-type="card" data-component-variant="elevated" class="bg-light-surface-container-lowest rounded-xl border border-light-outline-variant p-gutter-lg md:p-gutter-xl shadow-sm flex flex-col gap-gutter-lg">
        <form id="login-form" class="flex flex-col gap-gutter-md" onsubmit="handleLogin(event)">
          <!-- First Name -->
          <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-gutter-xs w-full">
            <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">First name</span>
            <input id="first-name" type="text" required placeholder="e.g. Leyla" class="w-full rounded border border-light-outline-variant bg-light-surface-container-lowest px-gutter-md py-gutter-sm font-body text-body-lg text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-2 focus:ring-light-primary-container focus:outline-none">
          </label>

          <!-- Last Name -->
          <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-gutter-xs w-full">
            <span class="font-label text-label-md text-light-on-surface" data-design-text-token="label-md">Last name</span>
            <input id="last-name" type="text" required placeholder="e.g. Mammadova" class="w-full rounded border border-light-outline-variant bg-light-surface-container-lowest px-gutter-md py-gutter-sm font-body text-body-lg text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-2 focus:ring-light-primary-container focus:outline-none">
          </label>

          <!-- Primary CTA -->
          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="mt-gutter-sm w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-gutter-md rounded-full bg-gradient-to-r from-light-primary to-light-secondary text-light-on-primary shadow-md hover:opacity-95 active:scale-95 transition-transform duration-state-change ease-state-change focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary">
            <span class="font-label text-label-lg" data-design-text-token="label-lg">Start Learning</span>
            <span class="material-symbols-outlined text-title-lg" aria-hidden="true">arrow_forward</span>
          </button>
        </form>

        <div id="login-feedback" class="hidden rounded bg-success-container text-on-success-container px-gutter-md py-gutter-sm font-label text-label-md text-center">
          Welcome! Heading to your study dashboard...
        </div>
      </section>

      <div class="text-center">
        <a href="#admin-login" class="font-label text-label-sm text-light-on-surface-variant hover:underline">Admin login</a>
      </div>
    </main>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      var first = document.getElementById('first-name').value.trim() || 'Leyla';
      var last = document.getElementById('last-name').value.trim() || 'Mammadova';
      try {
        localStorage.setItem('bandup_user', JSON.stringify({ firstName: first, lastName: last }));
      } catch (err) {}
      var fb = document.getElementById('login-feedback');
      fb.textContent = 'Welcome, ' + first + '! Your IELTS study streak starts now.';
      fb.classList.remove('hidden');
    }
  </script>


</body></html>
